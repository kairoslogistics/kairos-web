// y con texto rechazaban el uso del código, que la web mostraba como «ya se usó» (Jesús, 26 oct. 2026).
const limpio=o=>{const d=JSON.parse(JSON.stringify(o)); for(const [k,v] of Object.entries(o)) if(v instanceof Date||(v&&typeof v.toDate==='function')) d[k]=v; return d;};
const DB={
  async load(){
    if(MODO==='demo'){let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){} Object.assign(S,d||SEED()); TABLAS.forEach(t=>{S[t]=S[t]||[];}); return;}
    for(const t of TABLAS){const q=await db.collection(t).get(); S[t]=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.created_at||0)-(b.created_at||0));}
    // Arregla los códigos creados antes con la fecha de vencimiento como texto.
    for(const c of S.codigos) if(typeof c.vence==='string'&&!isNaN(new Date(c.vence))){try{const f=new Date(c.vence); await db.collection('codigos').doc(c.id).update({vence:f}); c.vence=f;}catch(e){console.error('vence',c.id,e);}}
  },
  persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},
  async save(t,row){
    if(!row.id) row.id=uid();
    if(MODO==='real'){if(!row.created_at) row.created_at=Date.now(); row.updated_at=Date.now(); await db.collection(t).doc(row.id).set(limpio(row));}
    const i=S[t].findIndex(x=>x.id===row.id); if(i>=0) S[t][i]=row; else S[t].push(row);
    if(MODO==='real'&&(t==='contactos'||t==='aliados')) await publicarPrecios();
    if(MODO==='demo') this.persist(); return row;
  },
  // Cambia solo algunos campos (las órdenes las crea el servidor y traen fechas que no hay que reescribir).
  async patch(t,id,f){
    if(MODO==='real') await db.collection(t).doc(id).update(f);
    const r=S[t].find(x=>x.id===id); if(r) Object.assign(r,f); if(MODO==='demo') this.persist();
  },
  async del(t,id){
    if(MODO==='real'){await db.collection(t).doc(id).delete(); if(t==='contactos'||t==='aliados'){S[t]=S[t].filter(x=>x.id!==id); await publicarPrecios();}}
    S[t]=S[t].filter(x=>x.id!==id); if(MODO==='demo') this.persist();
  }
};

/* Precios al cliente de acuerdos cerrados → documento público que lee la web (publico/tarifas). */
// Lo que va a la web: tarifas que Elise decidió publicar (o de acuerdos cerrados). La más reciente gana.
const enWeb=(c,t)=>t.web&&precioCliente(t)!=null&&(t.publicar||c.estado==='Acuerdo cerrado');
const INFO_WEB=[['almacen','Almacén'],['transito','Tránsito'],['minimo','Mínimo']];
function preciosWeb(){const w={};[...S.contactos,...S.aliados.filter(a=>a.estado!=='Inactivo').map(a=>({...a,estado:''}))].sort((a,b)=>(b.updated_at||b.created_at||0)-(a.updated_at||a.created_at||0)).forEach(c=>(c.tarifas||[]).forEach(t=>{if(enWeb(c,t)&&w[t.web]==null){w[t.web]=precioCliente(t);INFO_WEB.forEach(([k])=>{if(t[k]) w[t.web+'_'+k]=String(t[k]);});}}));return w;}
async function publicarPrecios(){if(MODO==='real') await db.collection('publico').doc('tarifas').set({...preciosWeb(),actualizado:Date.now()});}

function etapaPill(tipo,e){const L=ETAPAS[tipo]||[];const i=L.indexOf(e);const cls=e==='Cancelado'?'off':i===L.length-1||(tipo==='Referido'&&i===3)?'done':i>0?'mid':'';return '<span class="pill '+cls+'">'+esc(e||'Sin etapa')+'</span>';}
function negPill(e){return '<span class="pill '+(e==='Acuerdo cerrado'?'done':e==='Descartado'?'off':e==='Por contactar'?'':'mid')+'">'+esc(e)+'</span>';}
const activo=c=>{const L=ETAPAS[c.tipo]||ETAPAS['Carga'];return c.etapa!==L[L.length-1]&&c.etapa!=='Cancelado';};

async function copiar(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){} a.remove(); return ok;
}

/* Códigos para la web (Elise, 22 oct. 2026): la página pública ya no trae códigos escritos. Cada código se crea aquí, se manda al cliente
   cuando paga y el servidor lo marca al usarse. La web solo puede leer un código que ya conoce y sumarle un uso (ver firestore.rules). */
// Elise (30 oct. 2026): el registrador de gastos va aparte (20 USD) y solo viene con la asesoría 1 a 1 (150 USD, se vende por WhatsApp).
const COD_TIPOS=[['unoauno','Asesoría 1 a 1 150 USD: desglose, video, itinerario y registrador'],['asesoria','Asesoría 45 USD: desglose, video e itinerario'],['calculo','Otro vehículo 20 USD: desglose'],['plan','Itinerario de viaje 30 USD'],['gastos','Registrador de gastos 20 USD']];
// Un vehículo extra (20 USD) es un código de tipo «calculo» con un vehículo.
// Elise (26 oct. 2026): itinerario y asesoría duran 60 días (el itinerario se abre en hasta 3 dispositivos); otro vehículo, 30.
const venceDe=t=>new Date(Date.now()+(['plan','asesoria','unoauno','gastos'].includes(t)?60:30)*864e5);
const codTipo=k=>(COD_TIPOS.find(x=>x[0]===k)||[,k])[1];
function nuevoCodigo(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint32Array(6);crypto.getRandomValues(b);let c;do{c='KAI-'+[...b].map(n=>A[n%32]).join('');crypto.getRandomValues(b);}while(S.codigos.some(x=>x.id===c));return c;}
// Lo que el cliente vio cuando usó el código: datos del vehículo, el desglose y, si aplica, el plan de viaje.

  const s=c.sim||{}, simple=Object.entries(s).filter(([k,v])=>!Array.isArray(v)&&k!=='campos'&&k!=='pais_origen'), listas=Object.entries(s).filter(([,v])=>Array.isArray(v));
  return '<details><summary style="cursor:pointer;color:var(--brand);font-weight:700;font-size:14px">Ver lo que se le generó</summary><div style="display:grid;gap:8px;margin-top:8px;font-size:14px">'+
    '<dl class="kv">'+simple.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl>'+
    listas.map(([k,v])=>'<div><b>'+esc(k)+'</b><div style="display:grid;gap:2px;margin-top:4px">'+v.map(t=>'<span'+(String(t).startsWith('· ')?' style="color:var(--muted);padding-left:12px"':'')+'>'+esc(t)+'</span>').join('')+'</div></div>').join('')+
    '</div></details>';
}
// Itinerario: cuántas veces se abrió y en qué dispositivos (máximo 3). Si alguien cambia de teléfono, «Liberar» deja abrirlo de nuevo.
const fechaCod=v=>{const d=v&&v.toDate?v.toDate():new Date(v&&v.seconds?v.seconds*1000:v); return isNaN(d)?'—':d.toLocaleDateString('es-CL');};

/* Gastos de viaje (Jesús, 27 oct. 2026): lo que anotan los clientes en /gastos/ durante el viaje por tierra (colección gastos,

    (viajes.length?'<div class="list">'+viajes.map(g=>{const dias=[...new Set(g.L.map(x=>dia(x.fecha)))], tot=sum(g.L,()=>true);
      return '<details class="costo"><summary class="c-sum"><span class="c-nom" style="font-weight:700">'+esc(g.codigo||g.id)+'<br><span class="sub" style="font-weight:400">'+esc(g.cliente||'Sin cliente')+' · '+g.L.length+' gastos · '+dias.length+' día(s)</span></span><span class="c-k"><small>Total</small><b>'+usd(Math.round(tot*100)/100)+'</b></span></summary>'+

/* Cotización (Elise, 24 oct. 2026): cliente, vehículo y origen con menús, y los servicios de Costos y precios que aplican. */

  $('[data-czwa]').onclick=async()=>{leer();try{await navigator.clipboard.writeText(textoCz());toast('Cotización copiada');}catch(e){toast('No se pudo copiar');}};
  $('[data-czsave]').onclick=async()=>{leer();if(!cz.cliente.trim()){toast('Escribe el nombre del cliente');$('#cz-cliente').focus();return;}
    const el=czElegidos(cz), row={...cz,servicios:el.map(sv=>sv.id),detalle:el.map(sv=>({nombre:sv.nombre,precio:czPrecio(sv,cz)})),total:czTotal(cz),fecha:new Date().toLocaleDateString('es-CL')};

// Aprobar: crea el aliado con sus datos y precios, y deja la negociación en "Acuerdo cerrado" (Elise, 21 oct. 2026).
const esAliadoYa=c=>S.aliados.some(a=>(a.nombre||'').toLowerCase()===(c.empresa||'').toLowerCase());
function tipoDe(c){const sv=(c.servicios||[]).join(' ');
  return /broker/i.test(sv)?'Otro':/miami|courier|casillero/i.test(sv)?'Courier Miami':/china|ee\. uu|carga|consolidador|a[eé]reo|mar[ií]timo/i.test(sv)?'Carga internacional':/veh[ií]culo|auto/i.test(sv)?'Vehículos':/compra/i.test(sv)?'Agente de compra':/aduanas/i.test(sv)?'Agente de aduanas':/tierra/i.test(sv)?'Transporte por tierra':/encomiendas/i.test(sv)?'Encomiendas':'Otro';}
async function aprobar(c){
  const nota=[(c.servicios||[]).length?'Servicios: '+c.servicios.join(', '):'',c.costos_acordados?'Condiciones: '+c.costos_acordados:'',c.web?'Web: '+c.web:'',c.nota||''].filter(Boolean).join('\n');
  try{
    if(!esAliadoYa(c)) await DB.save('aliados',{nombre:c.empresa,pais:c.pais,tipo:tipoDe(c),contacto:'',ciudad:'',whatsapp:c.telefono||'',correo:c.correo||'',nota,tarifas:c.tarifas||[],servicios:(c.servicios||[]).filter(x=>SERVICIOS.includes(x)),costos_acordados:c.costos_acordados||'',contacto_id:c.id});
    await DB.save('contactos',{...c,estado:'Acuerdo cerrado'});
    render(); toast(c.empresa+' ahora es aliado');
  }catch(e){toast('No se pudo aprobar: '+(e.message||'revisa la conexión'));}
}
async function guardar(t,row,msg){try{await DB.save(t,row);render();toast(msg||'Guardado');return true;}catch(e){toast('No se pudo guardar: '+(e.message||'revisa la conexión'));return false;}}

function openForm(t,row,pre,foco){
  const nuevo=!row; row=row?JSON.parse(JSON.stringify(row)):{};

  document.body.appendChild(sc);
  const fl=sc.querySelector('#fl');
  const draw=()=>{
    let h='',buf=[];
    const flush=()=>{if(buf.length){h+='<div class="two">'+buf.join('')+'</div>';buf=[];}};
    F[t].forEach(f=>{
      const id='f-'+t+'-'+f.k, v=row[f.k]??'';
      let inp;
      if(f.t==='select'){const o=typeof f.o==='function'?f.o(row):f.o; if(f.dep&&!o.some(x=>x[0]===v)) row[f.k]=o[0][0];
        inp='<select id="'+id+'" data-k="'+f.k+'">'+o.map(([k,l])=>'<option value="'+esc(k)+'"'+(String(row[f.k]??'')===String(k)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';}
      else if(f.t==='area') inp='<textarea id="'+id+'" data-k="'+f.k+'">'+esc(v)+'</textarea>';
      else if(f.t==='multi'){const sel=row[f.k]||[]; inp='<div class="multi" id="'+id+'">'+f.o.map((x,i)=>'<label class="check"><input type="checkbox" data-multi="'+f.k+'" value="'+esc(x)+'"'+(sel.includes(x)?' checked':'')+'> '+esc(x)+'</label>').join('')+'</div>';}
      else if(f.t==='tarifas'){const T=row[f.k]=row[f.k]||[]; inp='<div class="tarifas" id="'+id+'">'+T.map((t,i)=>tfBlock(t,i,false)).join('')+
        '<button type="button" class="btn ghost sm" data-tadd>Agregar servicio con su costo</button></div>';}
      else if(f.t==='svc'){const T=row[f.k]=row[f.k]||[], on=row.servicios=row.servicios||[];
        inp='<div class="svc" id="'+id+'">'+SERVICIOS.map(x=>'<div class="svc-it'+(on.includes(x)?' on':'')+'"><label class="check"><input type="checkbox" data-svc="'+esc(x)+'"'+(on.includes(x)?' checked':'')+'> '+esc(x)+'</label>'+
          (on.includes(x)?T.map((t,i)=>t.servicio===x?tfBlock(t,i,true):'').join(''):'')+'</div>').join('')+
          (T.some(t=>!SERVICIOS.includes(t.servicio))?'<p class="hint">Otros precios</p>'+T.map((t,i)=>SERVICIOS.includes(t.servicio)?'':tfBlock(t,i,false)).join(''):'')+
          '<button type="button" class="btn ghost sm" data-tadd>Agregar otro precio</button></div>';}
      else inp='<input id="'+id+'" data-k="'+f.k+'" type="'+({num:'number',date:'date',month:'month'}[f.t]||'text')+'"'+(f.t==='num'?' step="any" inputmode="decimal"':'')+' value="'+esc(v)+'">';
      const el='<label class="fld" for="'+id+'">'+esc(f.l)+(f.req?' *':'')+inp+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</label>';
      if(f.half) buf.push(el); else {flush(); h+=el;}
    }); flush(); fl.innerHTML=h;
    fl.querySelectorAll('[data-k]').forEach(i=>{i.oninput=i.onchange=()=>{row[i.dataset.k]=i.value; if(F[t].some(f=>f.dep===i.dataset.k)) draw();};});
    fl.querySelectorAll('[data-svc]').forEach(c=>c.onchange=()=>{const x=c.dataset.svc; row.servicios=row.servicios||[]; row.tarifas=row.tarifas||[];
      if(c.checked){if(!row.servicios.includes(x)) row.servicios.push(x); if(!row.tarifas.some(t=>t.servicio===x)) row.tarifas.push({servicio:x,unidad:unidadDe(x),costo:'',gtipo:'precio',ganancia:'',web:''});}
      else {row.servicios=row.servicios.filter(y=>y!==x); row.tarifas=row.tarifas.filter(t=>t.servicio!==x);}
      draw(); const it=fl.querySelector('[data-svc="'+CSS.escape(x)+'"]'); if(it) it.focus();});
    fl.querySelectorAll('[data-multi]').forEach(c=>c.onchange=()=>{row[c.dataset.multi]=[...fl.querySelectorAll('[data-multi="'+c.dataset.multi+'"]:checked')].map(x=>x.value);});
    fl.querySelectorAll('.tf').forEach(box=>{const T=row.tarifas[+box.dataset.i];
      box.querySelectorAll('[data-t]').forEach(i=>{i.onchange=i.oninput=()=>{const k=i.dataset.t; T[k]=(k==='costo'||k==='ganancia')?(i.value===''?'':+i.value):i.value;
        if(k==='gtipo'){draw();return;} if(k!=='servicio'){box.querySelector('.tf-res').innerHTML=tfRes(T);}};});});
    fl.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{row.tarifas.splice(+b.dataset.tdel,1);draw();});
    fl.querySelectorAll('[data-pub]').forEach(c=>c.onchange=()=>{const x=row.tarifas[+c.dataset.pub];x.publicar=c.checked;});
    const ta=fl.querySelector('[data-tadd]'); if(ta) ta.onclick=()=>{row.tarifas.push({servicio:'',unidad:UNIDADES[0],costo:'',gtipo:'precio',ganancia:'',web:''});draw();};
  };
  draw();
  if(foco){const el=fl.querySelector('#f-'+t+'-'+foco); if(el) setTimeout(()=>el.closest('.fld').scrollIntoView({block:'start'}),0);}
  const close=()=>sc.remove();
  sc.onclick=e=>{if(e.target===sc) close();};
  sc.querySelector('[data-x]').onclick=close;
  const del=sc.querySelector('[data-del]');
  if(del) del.onclick=async()=>{
    if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='¿Seguro? Eliminar';return;}
    if(t==='aliados'&&(S.casos.some(c=>c.aliado_id===row.id)||S.cargas.some(c=>c.aliado_id===row.id))){sc.querySelector('#ferr').textContent='Este aliado tiene gestiones o cargas. Reasígnalas antes de eliminarlo.';return;}
    try{await DB.del(t,row.id); if(t==='contactos'||t==='aliados') await DB.save('descartados',{empresa:row.empresa||row.nombre,fecha:new Date().toISOString().slice(0,10)}); close();if(t==='aliados')allyOpen=null;render();toast('Eliminado');}catch(e){sc.querySelector('#ferr').textContent='No se pudo eliminar: '+(e.message||'revisa la conexión');}
  };
  sc.querySelector('form').onsubmit=async e=>{e.preventDefault();
    const falta=F[t].find(f=>f.req&&!String(row[f.k]||'').trim()); if(falta){sc.querySelector('#ferr').textContent='Completa «'+falta.l+'».';return;}
    F[t].forEach(f=>{if(f.t==='num') row[f.k]=row[f.k]===''||row[f.k]==null?null:+row[f.k];});
    if(row.tarifas) row.tarifas=row.tarifas.map(x=>({...x,precio:precioCliente(x)}));
    if(t==='contactos'||t==='aliados'){const nuevas=(row.tarifas||[]).filter(x=>x.web&&x.precio!=null&&!x.publicar);
      if(nuevas.length&&confirm('¿Publicar en la página web y en el simulador?\n\n'+nuevas.map(x=>'• '+(WEB.find(w=>w[0]===x.web)||['',''])[1].replace('Web: ','')+': '+usd(x.precio)+INFO_WEB.filter(([k])=>x[k]).map(([k,l])=>' · '+l+': '+x[k]).join('')).join('\n')+'\n\nAceptar = publicar ahora. Cancelar = guardar sin publicar.'))
        nuevas.forEach(x=>{x.publicar=true;x.publicado=new Date().toISOString().slice(0,10);});}
    if(await guardar(t,row)) close();
  };
  const first=fl.querySelector('input,select,textarea'); if(first) first.focus();
}

/* ===== Entrada (modo real) ===== */
function loginView(msg){
  $('#app').innerHTML='<form class="login" id="lf"><div class="brand" style="color:var(--brand)"><b>KAIROS LOGISTICS</b><small>Administración</small></div><label class="fld" for="le">Correo<input id="le" type="email" autocomplete="username" required></label><label class="fld" for="lp">Clave<input id="lp" type="password" autocomplete="current-password" required></label><p class="err" id="lerr">'+esc(msg||'')+'</p><button class="btn" type="submit">Entrar</button></form>';
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
    try{await auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value);}catch(err){$('#lerr').textContent='Correo o clave incorrectos. Revisa e intenta de nuevo.';return;} start();};
}
async function start(){
  try{await DB.load();}catch(e){if(MODO==='real'){loginView('Tu usuario no tiene permiso de administrador o la base de datos no responde.');return;}}
  shell();
}
(function boot(){
  const h=(location.hash||'').slice(1); tab=['aliados','alianzas','contactos','cargas','referidos','costos','cotizacion','pagos','codigos'].includes(h)?h:(pref.get('tab')||'aliados');
  if(MODO==='demo'){start();return;}
  const base='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
  const cargar=f=>new Promise((ok,mal)=>{const s=document.createElement('script');s.src=base+f;s.onload=ok;s.onerror=mal;document.head.appendChild(s);});
  cargar('firebase-app-compat.js').then(()=>Promise.all([cargar('firebase-auth-compat.js'),cargar('firebase-firestore-compat.js')])).then(()=>{
    firebase.initializeApp(FB); auth=firebase.auth(); db=firebase.firestore();
    let listo=false; auth.onAuthStateChanged(u=>{if(listo)return; listo=true; if(u) start(); else loginView();});
  }).catch(()=>loginView('No se pudo cargar la conexión. Revisa tu internet.'));
})();
</script>
